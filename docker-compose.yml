x-user-args: &user-args
  uid: ${UID:-1000}

x-workspace-volume: &workspace-volume
  source: .
  target: /workspace
  type: bind
  consistency: delegated

x-google-dns: &google-dns
  dns:
    - 8.8.8.8
    - 8.8.4.4

x-pnpm-svc: &pnpm-svc
  image: gcr.io/${PROJECT_ID:-local}/pnpm
  init: true
  entrypoint: ['pnpm']
  working_dir: /workspace
  volumes:
    - *workspace-volume

services:
  pnpm:
    <<: [*pnpm-svc, *google-dns]
    build:
      dockerfile: ./docker/pnpm/Dockerfile
      context: .
      cache_from:
        - gcr.io/${PROJECT_ID:-local}/pnpm
      args:
        <<: *user-args

  posthog:
    build:
      context: ./apps/posthog
    init: true
    environment:
      RESOLVER: 127.0.0.11
    ports:
      - '9003:8080'

  preview:
    build:
      context: ./apps/preview
    init: true
    environment:
      PREVIEWS_SERVICE_HOST: ${PREVIEWS_SERVICE_HOST:-previews.invalid}
      RESOLVER: 127.0.0.11
      VOICE_EDITOR_SERVICE_HOST: ${VOICE_EDITOR_SERVICE_HOST:-voice-editor.invalid}
    ports:
      - '9001:8080'

  preview-origin:
    build:
      context: ./apps/web
    init: true
    ports:
      - '9002:8080'

  server:
    <<: [*pnpm-svc, *google-dns]
    command: ['start', '--http', '--host=0.0.0.0', '--allowed-hosts=localhost']
    ports:
      - '8080:8080'

  voice-editor-origin:
    build:
      context: ./apps/voice-editor
    init: true
    ports:
      - '9004:8080'
