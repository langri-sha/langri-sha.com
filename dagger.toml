ignore = [
  "**/node_modules",
  "**/dist",
  "**/.next",
  "**/.tsbuild",
  "**/*.tsbuildinfo",
  "**/.terraform",
]

[modules.ci]
source = "github.com/langri-sha/dagger/ci@v1.4.0"

[modules.typescript]
source = "github.com/langri-sha/dagger/typescript@v1.4.0"

[modules.eslint]
source = "dagger.io/js/eslint"

[modules.eslint.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"

[modules.prettier]
source = "dagger.io/js/prettier"

[modules.prettier.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"

[modules.vitest]
source = "dagger.io/js/vitest"

[modules.vitest.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"

[modules.web]
source = "github.com/langri-sha/dagger/next@v1.4.0"

[modules.web.settings]
app = "apps/web"
outDir = "dist"

[modules.web.check]
skip = ["builds"]

[modules.voice-editor]
source = "github.com/langri-sha/dagger/next@v1.4.0"

[modules.voice-editor.settings]
app = "apps/voice-editor"
outDir = "dist"

[modules.voice-editor.check]
skip = ["builds"]

[modules.actionlint]
source = "github.com/langri-sha/dagger/actionlint@v1.6.0"

[modules.preview-router-image]
source = "github.com/langri-sha/dagger/nginx@v1.4.0"

[modules.preview-router-image.settings]
context = "apps/preview"
spec = "apps/preview/nginx.json"

[modules.preview-router-image.check]
skip = ["config", "responses"]

[modules.posthog-proxy-image]
source = "github.com/langri-sha/dagger/nginx@v1.4.0"

[modules.posthog-proxy-image.settings]
context = "apps/posthog"
spec = "apps/posthog/nginx.json"

[modules.posthog-proxy-image.check]
skip = ["config", "responses"]

[modules.web-image]
source = "github.com/langri-sha/dagger/nginx@v1.4.0"

[modules.web-image.settings]
context = "apps/web"
spec = "apps/web/nginx.json"
content = "dag://web/build"
contentPath = "dist"

[modules.web-image.check]
skip = ["config", "responses"]

[modules.voice-editor-image]
source = "github.com/langri-sha/dagger/nginx@v1.4.0"

[modules.voice-editor-image.settings]
context = "apps/voice-editor"
spec = "apps/voice-editor/nginx.json"
content = "dag://voice-editor/build"
contentPath = "dist"
variables = ["BASE_PATH="]

[modules.voice-editor-image.check]
skip = ["config", "responses"]
