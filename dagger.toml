ignore = [
  "**/node_modules",
  "**/dist",
  "**/.next",
  "**/.tsbuild",
  "**/*.tsbuildinfo",
  "**/.terraform",
]

[modules.ci]
source = "github.com/langri-sha/dagger/ci@v1.2.0"

[modules.typescript]
source = "github.com/langri-sha/dagger/typescript@v1.2.0"

[modules.eslint]
source = "dagger.io/js/eslint"

[modules.eslint.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"

[modules.prettier]
source = "dagger.io/js/prettier"

[modules.prettier.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"

[modules.vitest]
source = "dagger.io/js/vitest"

[modules.vitest.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"
