name: Voice editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/voice-editor.yml'
      - 'apps/voice-editor/**'
      - 'packages/**'
  pull_request:
    paths:
      - '.github/workflows/voice-editor.yml'
      - 'apps/voice-editor/**'
      - 'packages/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      base-path: ${{ steps.selector.outputs.base-path }}
      traffic-tag: ${{ steps.selector.outputs.traffic-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.14.1

      - name: Configure environment
        id: selector
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base-path=/pull/$PR_NUMBER/voice-editor" >> $GITHUB_OUTPUT
            echo "traffic-tag=pull-$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "base-path=/voice-editor" >> $GITHUB_OUTPUT
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Build
        run: pnpm run --filter @langri-sha/voice-editor build
        env:
          BASE_PATH: ${{ steps.selector.outputs.base-path }}

      - name: Create artifact
        uses: actions/upload-artifact@v7
        with:
          name: voice-editor
          path: apps/voice-editor/dist
          if-no-files-found: error

      - name: Build image
        run: docker build --tag voice-editor-origin apps/voice-editor

      - name: Check configuration
        run: docker run --rm voice-editor-origin nginx -t

      - name: Check responses
        run: |
          docker run --detach --name origin --publish 8080:8080 voice-editor-origin

          for _ in $(seq 30); do
            curl --silent --output /dev/null http://localhost:8080/ && break
            sleep 1
          done

          expect() {
            got=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080$1")

            if [ "$got" != "$2" ]; then
              echo "::error::$1 answered $got, expected $2"
              return 1
            fi

            echo "ok  $1 -> $got"
          }

          expect / 200
          expect /no-such-page 404
          expect /no-such-page/ 404

          if ! curl --silent http://localhost:8080/no-such-page | grep --quiet 'could not be found'; then
            echo "::error::the 404 answer is not the export's 404 page"
            exit 1
          fi

          if ! curl --silent http://localhost:8080/ | grep --quiet "$BASE_PATH/_next/"; then
            echo "::error::the export does not address its assets under $BASE_PATH/"
            exit 1
          fi

          echo "ok  assets addressed under $BASE_PATH/"

          header() {
            if ! curl --silent --head "http://localhost:8080$1" | grep --ignore-case --quiet "^$2: *$3"; then
              echo "::error::$1 does not answer with $2: $3"
              return 1
            fi

            echo "ok  $1 -> $2: $3"
          }

          header / cache-control 'public, no-store'
          header / x-robots-tag noindex
          header /no-such-page x-robots-tag noindex
        env:
          BASE_PATH: ${{ steps.selector.outputs.base-path }}

  preview:
    name: Preview
    if: vars.VOICE_EDITOR_SERVICE != ''
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: voice-editor-preview-${{ github.ref }}
    environment:
      name: preview
      url: ${{ format('{0}{1}/', vars.URL, needs.build.outputs.base-path) }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.VOICE_EDITOR_IMAGE }}
      IMAGE_TAG: ${{ needs.build.outputs.traffic-tag || 'main' }}-${{ github.sha }}
      TRAFFIC_TAG: ${{ needs.build.outputs.traffic-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.14.1
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: voice-editor
          path: apps/voice-editor/dist

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker build --tag "$IMAGE:$IMAGE_TAG" apps/voice-editor
          docker push "$IMAGE:$IMAGE_TAG"

      - name: Deploy
        run: |
          if [ -n "$TRAFFIC_TAG" ]; then
            gcloud run deploy ${{ vars.VOICE_EDITOR_SERVICE }} \
              --image "$IMAGE:$IMAGE_TAG" \
              --no-traffic \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }} \
              --tag "$TRAFFIC_TAG"
          else
            gcloud run deploy ${{ vars.VOICE_EDITOR_SERVICE }} \
              --image "$IMAGE:$IMAGE_TAG" \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }}

            gcloud run services update-traffic ${{ vars.VOICE_EDITOR_SERVICE }} \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }} \
              --to-latest
          fi
