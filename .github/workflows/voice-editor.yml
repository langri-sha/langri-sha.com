name: Voice editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/voice-editor.yml'
      - 'apps/voice-editor/**'
      - 'dagger.lock'
      - 'dagger.toml'
      - 'packages/**'
  pull_request:
    paths:
      - '.github/workflows/voice-editor.yml'
      - 'apps/voice-editor/**'
      - 'dagger.lock'
      - 'dagger.toml'
      - 'packages/**'

env:
  dagger-version: v1.0.0-beta.20

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      base-path: ${{ steps.selector.outputs.base-path }}
      traffic-tag: ${{ steps.selector.outputs.traffic-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.dagger-version }}

      - name: Configure environment
        id: selector
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base-path=/pull/$PR_NUMBER/voice-editor" >> "$GITHUB_OUTPUT"
            echo "traffic-tag=pull-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "base-path=/voice-editor" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Build
        run: >-
          dagger call voice-editor
          --environment "BASE_PATH=$BASE_PATH"
          build export --path apps/voice-editor/dist
        env:
          BASE_PATH: ${{ steps.selector.outputs.base-path }}

      - name: Create artifact
        uses: actions/upload-artifact@v7
        with:
          name: voice-editor
          path: apps/voice-editor/dist
          if-no-files-found: error

      - name: Check configuration
        run: dagger call voice-editor-image --content apps/voice-editor/dist verify-config

      - name: Check responses
        run: >-
          dagger call voice-editor-image
          --content apps/voice-editor/dist
          --variables "BASE_PATH=$BASE_PATH"
          verify-responses
        env:
          BASE_PATH: ${{ steps.selector.outputs.base-path }}

  preview:
    name: Preview
    if: vars.VOICE_EDITOR_SERVICE != ''
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: voice-editor-preview-${{ github.ref }}
    environment:
      name: preview
      url: ${{ format('{0}{1}/', vars.URL, needs.build.outputs.base-path) }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.VOICE_EDITOR_IMAGE }}
      IMAGE_TAG: ${{ needs.build.outputs.traffic-tag || 'main' }}-${{ github.sha }}
      TRAFFIC_TAG: ${{ needs.build.outputs.traffic-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.31.0
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: voice-editor
          path: apps/voice-editor/dist

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker build --tag "$IMAGE:$IMAGE_TAG" apps/voice-editor
          docker push "$IMAGE:$IMAGE_TAG"

      - name: Deploy
        run: |
          retry() {
            for delay in 10 20 40; do
              if "$@" 2> "$RUNNER_TEMP/gcloud.log"; then
                cat "$RUNNER_TEMP/gcloud.log" >&2
                return
              fi

              cat "$RUNNER_TEMP/gcloud.log" >&2
              grep -q 'ABORTED: Conflict' "$RUNNER_TEMP/gcloud.log" || return 1
              echo "Another deploy updated the service, retrying in ${delay}s" >&2
              sleep "$delay"
            done

            "$@"
          }

          if [ -n "$TRAFFIC_TAG" ]; then
            retry gcloud run deploy ${{ vars.VOICE_EDITOR_SERVICE }} \
              --image "$IMAGE:$IMAGE_TAG" \
              --no-traffic \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }} \
              --tag "$TRAFFIC_TAG"
          else
            retry gcloud run deploy ${{ vars.VOICE_EDITOR_SERVICE }} \
              --image "$IMAGE:$IMAGE_TAG" \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }}

            retry gcloud run services update-traffic ${{ vars.VOICE_EDITOR_SERVICE }} \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }} \
              --to-latest
          fi
