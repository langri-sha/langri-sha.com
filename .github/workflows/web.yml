name: Web

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - released

env:
  dagger-version: v1.0.0-beta.18

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'production' || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.dagger-version }}

      - name: Build
        run: >-
          dagger call web
          --environment "ASSETS_URL=$ASSETS_URL"
          --environment "NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN"
          build export --path apps/web/dist
        env:
          ASSETS_URL: ${{ vars.ASSETS_URL }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}

      - name: Create artifact
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/web/dist
          if-no-files-found: error

  deploy:
    name: Deploy
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: production
      url: ${{ vars.URL }}
    permissions:
      contents: read
      id-token: write
    env:
      GZIP_TYPES: css,eot,html,js,json,otf,svg,ttf,txt

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.30.0
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: dist/web

      - name: Publish assets
        run: |
          gcloud storage cp dist/web/_next/** gs://${{ vars.ASSETS_BUCKET }}/_next \
            --cache-control="public, max-age=31536000, immutable" \
            --no-clobber \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --recursive

      - name: Publish
        run: |
          rm -rf dist/web/_next

          gcloud storage cp dist/web/* gs://${{ vars.BUCKET }} \
            --cache-control="public, max-age=0, s-maxage=86400, must-revalidate" \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --recursive

      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.URL_MAP }} \
            --host "${URL#https://}" \
            --path "/*" \
            --project ${{ vars.EDGE_PROJECT_ID }}
        env:
          URL: ${{ vars.URL }}

  preview:
    name: Preview
    if: vars.PREVIEW_SERVICE != ''
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.ref }}
    environment:
      name: preview
      url: ${{ format('{0}{1}/', vars.URL, steps.selector.outputs.base-path) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.dagger-version }}

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.30.0
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Configure environment
        id: selector
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base-path=/pull/$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "traffic-tag=pull-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "base-path=/release/$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "traffic-tag=release-${TAG_NAME//./-}" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Build
        run: >-
          dagger call web
          --environment "ASSETS_URL=$ASSETS_URL"
          --environment "BASE_PATH=$BASE_PATH"
          --environment "NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=$NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN"
          build export --path apps/web/dist
        env:
          ASSETS_URL: ${{ vars.ASSETS_URL }}
          BASE_PATH: ${{ steps.selector.outputs.base-path }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}

      - name: Build image
        run: docker build --tag preview-origin apps/web

      - name: Check configuration
        run: test "$(dagger call web-image --content apps/web/dist config pass)" = true

      - name: Check responses
        run: test "$(dagger call web-image --content apps/web/dist responses pass)" = true

      - name: Publish assets
        run: |
          find apps/web/dist/_next -type d -empty -delete

          gcloud storage cp apps/web/dist/_next/** gs://${{ vars.ASSETS_BUCKET }}/_next \
            --cache-control="public, max-age=31536000, immutable" \
            --no-clobber \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --recursive

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker tag preview-origin "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$IMAGE_TAG"
        env:
          IMAGE: ${{ vars.PREVIEW_IMAGE }}
          IMAGE_TAG: ${{ steps.selector.outputs.traffic-tag || 'main' }}-${{ github.sha }}

      - name: Deploy
        run: |
          if [ -n "$TRAFFIC_TAG" ]; then
            gcloud run deploy ${{ vars.PREVIEW_SERVICE }} \
              --image "$IMAGE:$IMAGE_TAG" \
              --no-traffic \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }} \
              --tag "$TRAFFIC_TAG"
          else
            gcloud run deploy ${{ vars.PREVIEW_SERVICE }} \
              --image "$IMAGE:$IMAGE_TAG" \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }}

            gcloud run services update-traffic ${{ vars.PREVIEW_SERVICE }} \
              --project ${{ vars.EDGE_PROJECT_ID }} \
              --quiet \
              --region ${{ vars.PREVIEW_REGION }} \
              --to-latest
          fi
        env:
          IMAGE: ${{ vars.PREVIEW_IMAGE }}
          IMAGE_TAG: ${{ steps.selector.outputs.traffic-tag || 'main' }}-${{ github.sha }}
          TRAFFIC_TAG: ${{ steps.selector.outputs.traffic-tag }}
