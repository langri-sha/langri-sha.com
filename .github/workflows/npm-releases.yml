name: npm releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/npm-releases.yml'
      - 'Cargo.*'
      - 'apps/npm-releases/**'
      - 'packages/telemetry/**'
      - 'rust-toolchain.toml'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/npm-releases.yml'
      - 'Cargo.*'
      - 'apps/npm-releases/**'
      - 'packages/telemetry/**'
      - 'rust-toolchain.toml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run:
          docker build --file apps/npm-releases/Dockerfile --tag npm-releases .

      - name: Check the image runs
        run: docker run --rm npm-releases --help

  publish:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.NPM_RELEASES_JOB != ''
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.24.0
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker build --file apps/npm-releases/Dockerfile --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
        env:
          IMAGE: ${{ vars.NPM_RELEASES_IMAGE }}

      - name: Deploy
        run: |
          gcloud run jobs update ${{ vars.NPM_RELEASES_JOB }} \
            --image "${{ vars.NPM_RELEASES_IMAGE }}:$GITHUB_SHA" \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --quiet \
            --region ${{ vars.NPM_RELEASES_REGION }}
