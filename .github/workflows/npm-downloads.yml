name: npm downloads

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/npm-downloads.yml'
      - 'Cargo.*'
      - 'apps/npm-downloads/**'
      - 'packages/telemetry/**'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/npm-downloads.yml'
      - 'Cargo.*'
      - 'apps/npm-downloads/**'
      - 'packages/telemetry/**'
      - 'rust-toolchain.toml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run:
          docker build --file apps/npm-downloads/Dockerfile --tag npm-downloads .

      - name: Check the image runs
        run: docker run --rm npm-downloads --help

      - name: Report image size
        uses: langri-sha/github/actions/image-status@a2252e0c9b77a9207a28ea2f85117a8ad800a110
        with:
          image: npm-downloads

  publish:
    name: Publish
    if: github.event_name == 'push' && vars.NPM_DOWNLOADS_JOB != ''
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.24.0
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker build --file apps/npm-downloads/Dockerfile --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
        env:
          IMAGE: ${{ vars.NPM_DOWNLOADS_IMAGE }}

      - name: Report image size
        uses: langri-sha/github/actions/image-status@a2252e0c9b77a9207a28ea2f85117a8ad800a110
        with:
          address: ${{ vars.NPM_DOWNLOADS_IMAGE }}:${{ github.sha }}
          image: ${{ vars.NPM_DOWNLOADS_IMAGE }}:${{ github.sha }}

      - name: Deploy
        run: |
          gcloud run jobs update ${{ vars.NPM_DOWNLOADS_JOB }} \
            --image "${{ vars.NPM_DOWNLOADS_IMAGE }}:$GITHUB_SHA" \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --quiet \
            --region ${{ vars.NPM_DOWNLOADS_REGION }}
