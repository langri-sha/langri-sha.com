name: Workspace

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    # The called workflow's Renovate post-upgrade job declares `contents:
    # write`, and a called job may not exceed the caller's ceiling. Without
    # this the run fails at startup before any job is created.
    permissions:
      contents: write
      id-token: write
    uses: langri-sha/github/.github/workflows/check.yml@v0.31.0
    with:
      dagger: true
      dagger-version: v1.0.0-beta.19
      eslint: true
      prettier: true
      projen: true
      vitest: true
      posthog-project-id: ${{ vars.POSTHOG_PROJECT_ID }}
      posthog-project-token: ${{ vars.POSTHOG_PROJECT_TOKEN }}
    secrets: inherit

  trace:
    name: PostHog Trace
    needs: [check]
    if: always() && needs.check.outputs.posthog-trace-url
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Link trace
        uses: langri-sha/github/actions/posthog-trace-status@v0.31.0
        with:
          url: ${{ needs.check.outputs.posthog-trace-url }}
