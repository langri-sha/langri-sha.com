name: Preview router

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preview-router.yml'
      - 'apps/preview/**'
  pull_request:
    paths:
      - '.github/workflows/preview-router.yml'
      - 'apps/preview/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag preview-router apps/preview

      - name: Check configuration
        run: |
          docker run --rm \
            --env PREVIEWS_SERVICE_HOST=previews.invalid \
            preview-router nginx -t

      - name: Check routing
        run: |
          docker run --detach --name router --publish 8080:8080 \
            --env PREVIEWS_SERVICE_HOST=previews.invalid \
            --env RESOLVER=8.8.8.8 \
            preview-router

          for _ in $(seq 30); do
            curl --silent --output /dev/null http://localhost:8080/ && break
            sleep 1
          done

          expect() {
            got=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080$1")

            if [ "$got" != "$2" ]; then
              echo "::error::$1 answered $got, expected $2"
              return 1
            fi

            echo "ok  $1 -> $got"
          }

          expect /pull/1234/foobar 502
          expect /pull/1234 308
          expect /release/v2.13.0/foobar 502
          expect / 502

          expect /pull/abc/foobar 404
          expect /pull/0123/foobar 404
          expect /release/2.13.0/foobar 404

          mapped() {
            if ! docker logs router 2>&1 | grep --quiet "$1"; then
              echo "::error::no request was routed to $1"
              return 1
            fi

            echo "ok  mapped $1"
          }

          mapped pull-1234---previews.invalid
          mapped release-v2-13-0---previews.invalid
