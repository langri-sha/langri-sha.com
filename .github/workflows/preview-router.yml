name: Preview router

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preview-router.yml'
      - 'apps/preview/**'
      - 'dagger.lock'
      - 'dagger.toml'
  pull_request:
    paths:
      - '.github/workflows/preview-router.yml'
      - 'apps/preview/**'
      - 'dagger.lock'
      - 'dagger.toml'

env:
  dagger-version: v1.0.0-beta.23

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.dagger-version }}

      - name: Check configuration
        run: dagger call preview-router-image verify-config

      - name: Check routing
        run: dagger call preview-router-image verify-responses

  publish:
    name: Publish
    if: github.event_name == 'push' && vars.PREVIEW_ROUTER_SERVICE != ''
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.34.0
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker build --tag "$IMAGE:$GITHUB_SHA" apps/preview
          docker push "$IMAGE:$GITHUB_SHA"
        env:
          IMAGE: ${{ vars.PREVIEW_ROUTER_IMAGE }}

      - name: Deploy
        run: |
          gcloud run services update ${{ vars.PREVIEW_ROUTER_SERVICE }} \
            --image "${{ vars.PREVIEW_ROUTER_IMAGE }}:$GITHUB_SHA" \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --quiet \
            --region ${{ vars.PREVIEW_REGION }}
