name: Preview router

# Previews are not production, and the router is what makes them reachable at
# all. Holding a fix behind a site release would mean preview access stays
# broken until unrelated work ships, so this deploys from `main`.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preview-router.yml'
      - 'apps/preview/**'
  pull_request:
    paths:
      - '.github/workflows/preview-router.yml'
      - 'apps/preview/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag preview-router apps/preview

      # The entrypoint substitutes the template before nginx reads it, so this
      # is the only thing that checks the rendered config parses at all.
      - name: Check configuration
        run: |
          docker run --rm \
            --env PREVIEWS_SERVICE_HOST=previews.invalid \
            preview-router nginx -t

      - name: Check routing
        run: |
          # `.invalid` never resolves, so a selector that routes fails at DNS
          # with a 502 and one that does not answers 404, without the runner
          # ever reaching an upstream. A public resolver keeps this off the
          # Docker network that `RESOLVER=127.0.0.11` would need.
          docker run --detach --name router --publish 8080:8080 \
            --env PREVIEWS_SERVICE_HOST=previews.invalid \
            --env RESOLVER=8.8.8.8 \
            preview-router

          for _ in $(seq 30); do
            curl --silent --output /dev/null http://localhost:8080/ && break
            sleep 1
          done

          expect() {
            got=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080$1")

            if [ "$got" != "$2" ]; then
              echo "::error::$1 answered $got, expected $2"
              return 1
            fi

            echo "ok  $1 -> $got"
          }

          expect /pull/1234/foobar 502
          expect /pull/1234 308
          expect /release/v2.13.0/foobar 502
          expect / 502

          # A selector that does not parse must not fall through to `main`.
          expect /pull/abc/foobar 404
          expect /pull/0123/foobar 404
          expect /release/2.13.0/foobar 404

          mapped() {
            if ! docker logs router 2>&1 | grep --quiet "$1"; then
              echo "::error::no request was routed to $1"
              return 1
            fi

            echo "ok  mapped $1"
          }

          mapped pull-1234---previews.invalid
          mapped release-v2-13-0---previews.invalid

  publish:
    name: Publish
    # Terraform owns the service. Until it has applied there is nothing to
    # update, and this is a no-op rather than a permanently red `main`.
    if: github.event_name == 'push' && vars.PREVIEW_ROUTER_SERVICE != ''
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Google Cloud Platform
        uses: langri-sha/github/actions/google-cloud-platform@v0.14.1
        with:
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          setup_gcloud: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Publish image
        run: |
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet

          docker build --tag "$IMAGE:$GITHUB_SHA" apps/preview
          docker push "$IMAGE:$GITHUB_SHA"
        env:
          IMAGE: ${{ vars.PREVIEW_ROUTER_IMAGE }}

      # `update` rather than `deploy`, which creates the service when it is
      # missing and would take ingress and VPC egress from defaults instead of
      # from Terraform — publishing the router without the settings that keep
      # previews off the internet.
      - name: Deploy
        run: |
          gcloud run services update ${{ vars.PREVIEW_ROUTER_SERVICE }} \
            --image "${{ vars.PREVIEW_ROUTER_IMAGE }}:$GITHUB_SHA" \
            --project ${{ vars.EDGE_PROJECT_ID }} \
            --quiet \
            --region ${{ vars.PREVIEW_REGION }}
